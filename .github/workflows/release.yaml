name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller YT-Video-Downloader.spec --noconfirm --clean

      - name: Package Portable ZIP
        shell: powershell
        run: |
          # Add portable indicator and portable readme to the dist bundle
          New-Item -ItemType File -Path "dist\YT-Video-Downloader\portable.txt" -Force
          Copy-Item -Path "README-PORTABLE.txt" -Destination "dist\YT-Video-Downloader\" -Force
          
          # Compress folder into portable zip
          Compress-Archive -Path "dist\YT-Video-Downloader" -DestinationPath "dist\YT-Video-Downloader-Portable.zip" -Force
          
          # Remove portable indicator from onedir folder before building the standard installer
          Remove-Item -Path "dist\YT-Video-Downloader\portable.txt" -Force

      - name: Build Windows Installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Verify Generated Binaries
        shell: powershell
        run: |
          Get-Item dist\installer\YT-Video-Downloader-Setup.exe
          Get-Item dist\YT-Video-Downloader-Portable.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Video-Downloader-Setup
          path: dist/installer/YT-Video-Downloader-Setup.exe
          retention-days: 14

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Video-Downloader-Portable
          path: dist/YT-Video-Downloader-Portable.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/YT-Video-Downloader-Setup.exe
            dist/YT-Video-Downloader-Portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
